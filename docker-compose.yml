# Local development stack: PostgreSQL plus the application.
#
#   cp .env.example .env               # then set POSTGRES_PASSWORD / DATABASE_URL
#   docker compose up -d db            # start a disposable database
#   npm ci && npm run db:migrate       # install and migrate from the host
#   npm run dev                        # run the app with hot reload
#
# Or run everything in containers: `docker compose up --build`.
# Credentials below are local-only placeholders and must never be reused in production.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nse_pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nse_pulse}
    # Published only on loopback so the database is not reachable from the network.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # Exact browser origin allowed by CORS. This stack runs the API only; serve the
      # built client (dist/) from a static host or reverse proxy and set APP_ORIGIN to it.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://nse_pulse:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/${POSTGRES_DB:-nse_pulse}
      DATABASE_SSL: 'false'
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-none}
      ALLOW_DEMO_MARKET_DATA: 'false'
      HISTORICAL_DATA_PERMISSION_CONFIRMED: ${HISTORICAL_DATA_PERMISSION_CONFIRMED:-false}
      ANNOUNCEMENTS_PERMISSION_CONFIRMED: ${ANNOUNCEMENTS_PERMISSION_CONFIRMED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SCHEDULER: 'false'
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:4000/api/v1/health/live || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Disposable PostgreSQL for integration tests. Never attached to the app.
  #   docker compose --profile test up -d db-test
  #   TEST_DATABASE_URL=postgres://nse_pulse_test:test_only@127.0.0.1:5433/nse_pulse_test \
  #     npm run test:integration:verified
  # `:verified` fails when the suite skips instead of running, so a wrong URL cannot
  # masquerade as a passing run.
  db-test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: nse_pulse_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: nse_pulse_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nse_pulse_test -d nse_pulse_test']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
