openapi: 3.1.0
info:
  title: NSE Pulse API
  version: 1.0.0
  description: Kenyan market research API; empty arrays and missing values are explicit when data is not configured.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Application, database and provider health
      responses:
        '200': { description: Health status; provider and database status are independent }
  /providers:
    get:
      summary: Provider adapter status
      responses:
        '200': { description: Provider states; credentials are never included }
  /providers/configuration:
    get:
      summary: Provider commissioning view
      description: Provider name and integration status, credential presence (never values), declared securities coverage, access level, last successful retrieval, connection/data-validation results and outstanding licensing.
      responses:
        '200':
          { description: Explicit unconfigured or demo state; no endpoint, credential or live-data claim is invented }
  /providers/test:
    post:
      summary: Run local adapter connection and data-validation checks
      description: Local checks only. The response states whether any outbound network request was made.
      responses:
        '200': { description: Test results plus the refreshed configuration view }
        '429': { description: Too many test runs }
  /data-sources:
    get:
      summary: Independent data-source permissions and freshness
      description: Historical records, issuer announcements, the security master and the live quote feed each carry an explicit permission basis and freshness label.
      responses:
        '200': { description: Source descriptors; availability never implies a licence }
  /announcements:
    get:
      summary: Official company announcements from an enabled permitted source
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200': { description: AS_PUBLISHED items, or an explicit permission/store/empty reason }
  /market/overview:
    get:
      summary: NSE overview and freshness
      responses:
        '200': { description: Empty indices and breadth mean no configured observations, not zero activity }
  /securities:
    get:
      summary: Search the imported security master
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Database records only }
        '400': { description: Invalid query parameters }
  /quotes/{symbol}:
    get:
      summary: Latest stored observation and provenance
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9.-]{1,24}$' } }
      responses:
        '200': { description: Security and quote, or a quote-unavailable reason }
        '400': { description: Invalid symbol }
        '404': { description: Security not found }
  /history/{symbol}:
    get:
      summary: Stored historical prices
      description: Served independently of the live quote adapter, but withheld unless HISTORICAL_DATA_PERMISSION_CONFIRMED=true. Responses carry a permission basis and END_OF_DAY freshness label.
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Stored history, or an explicit withheld/empty state }
        '400': { description: Invalid range }
  /technicals/{symbol}:
    get:
      summary: Technical indicators calculated from stored observations
      description: Uses the same historical permission gate as /history. Demo fixtures are labelled and exempt.
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Indicator values with period, calculation and data requirements }
        '404': { description: Security not found }
